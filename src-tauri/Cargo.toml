[package]
name = "meal-planner"
version = "0.1.0"
description = "Meal planning for busy families"
edition = "2021"

[lib]
name = "meal_planner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
